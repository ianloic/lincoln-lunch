name: Publish lunch calendar

on:
  schedule:
    # Nightly, ~3am Pacific (cron is UTC).
    - cron: "17 10 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: python3 -m unittest -v

      - name: Build calendar
        run: python3 lincoln_lunch.py --out site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # A failed build never reaches here, so the last good calendar stays published.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and nothing here commits. Re-enabling the workflow resets
      # that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
